<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal del Coordinador de Área — URP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0f8f5e;
  --brand-oscuro:#0b6e48;
  --brand-suave:#e6f4ee;
  --tinta:#15201b;
  --tinta-media:#5a6660;
  --tinta-tenue:#8c948f;
  --linea:#dfe4e1;
  --fondo:#f6f8f7;
  --papel:#ffffff;
  --ok:#0f8f5e;
  --parcial:#b8860b;
  --falla:#c0392b;
  --neutro:#8c948f;
  --radio:8px;
}
*{box-sizing:border-box}
html{zoom:1.22}
body{
  margin:0;background:var(--fondo);color:var(--tinta);
  font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.5;
}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;font-size:inherit;cursor:pointer}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------------------------------------------------------------- cabecera */
header{
  background:var(--papel);border-bottom:1px solid var(--linea);
  padding:10px 20px;display:flex;align-items:center;gap:14px;
  position:sticky;top:0;z-index:20;
}
.marca{display:flex;flex-direction:column;line-height:1.2}
.marca b{font-size:14px;font-weight:600}
.marca span{font-size:11px;color:var(--tinta-media)}
.sello{
  width:34px;height:30px;border-radius:6px;background:var(--brand);
  color:#fff;display:grid;place-items:center;font-weight:700;font-size:12.5px;
  letter-spacing:.02em;flex:none;
}
.espacio{flex:1}
.usuario{text-align:right;line-height:1.25}
.usuario b{display:block;font-size:12px;font-weight:600}
.usuario span{font-size:11px;color:var(--tinta-media)}

/* ------------------------------------------------------------------ layout */
main{max-width:1180px;margin:0 auto;padding:20px}
.oculto{display:none !important}

.btn{
  border:1px solid var(--brand);background:var(--brand);color:#fff;
  padding:7px 14px;border-radius:var(--radio);font-weight:500;
}
.btn:hover{background:var(--brand-oscuro);border-color:var(--brand-oscuro)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.fantasma{background:transparent;color:var(--brand)}
.btn.fantasma:hover{background:var(--brand-suave)}
.btn.gris{background:transparent;color:var(--tinta-media);border-color:var(--linea)}
.btn.gris:hover{background:var(--fondo);color:var(--tinta)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ------------------------------------------------------------------ ingreso */
#ingreso{
  /* Alineado arriba, no centrado: centrar en vertical lo hundia en la pantalla
     y dejaba una franja vacia bajo la cabecera. */
  display:flex;justify-content:center;align-items:flex-start;padding:8px 0 40px;
}

/* Una sola pieza: el afiche da contexto, el ingreso es la accion. Misma altura
   los dos lados para que se lean como una composicion y no como dos objetos. */
.acceso{
  display:flex;align-items:stretch;
  width:100%;max-width:940px;
  background:var(--papel);border:1px solid var(--linea);border-radius:14px;
  box-shadow:0 2px 14px rgba(21,32,27,.07);overflow:hidden;
}
.portada{width:376px;flex:none;background:var(--fondo)}
.portada img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}

.acceso .caja{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:48px 44px;text-align:center;
}
#ingreso h1{font-size:22px;margin-bottom:10px}
#ingreso p{color:var(--tinta-media);font-size:14px;margin:0 0 26px;line-height:1.55;
  max-width:38ch;margin-left:auto;margin-right:auto}
#botonGoogle{display:flex;justify-content:center}
#ingreso .nota{margin-top:26px;font-size:11.5px;color:var(--tinta-tenue);line-height:1.5}
/* Vacio no ocupa sitio: si reserva altura, empuja todo el panel hacia abajo. */
#ingresoError:empty{display:none}
#ingresoError{margin-top:16px}

@media (max-width:820px){
  html{zoom:1}
  #ingreso{padding:12px 0 32px}
  .acceso{flex-direction:column;max-width:440px}
  .portada{order:2;width:100%}
  .portada img{height:auto}
  .acceso .caja{order:1;padding:34px 26px}
}

/* ------------------------------------------------------------------ tablero */
.barra{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.barra h2{font-size:17px}
.barra .sub{font-size:12px;color:var(--tinta-media)}
.filtro{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tinta-media)}
select,input[type=text],input[type=date],input[type=url],textarea{
  font-family:inherit;font-size:13px;color:var(--tinta);
  border:1px solid var(--linea);border-radius:6px;padding:5px 8px;background:var(--papel);
}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.5}
select:focus,input:focus,textarea:focus{border-color:var(--brand);outline:none}

.tabla{
  background:var(--papel);border:1px solid var(--linea);border-radius:10px;overflow:hidden;
}
table{width:100%;border-collapse:collapse}
/* Sin position:sticky a proposito: el zoom del documento descuadra las
   coordenadas del sticky y el encabezado termina montado sobre la primera fila. */
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--tinta-media);font-weight:600;padding:9px 12px;
  border-bottom:1px solid var(--linea);background:var(--fondo);
}
td{padding:10px 12px;border-bottom:1px solid var(--linea);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#fafcfb}
.curso b{display:block;font-weight:600}
.curso small{color:var(--tinta-media);font-size:11.5px}
.codigo{font-size:11.5px;color:var(--tinta-media);display:block}
.subtitulo{font-size:11px;font-weight:600;color:var(--tinta-media);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.rejilla .full{grid-column:1 / -1}
.temas{display:grid;gap:12px;margin-bottom:20px}
.temas textarea{min-height:56px}

.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{
  border:1px solid var(--linea);background:var(--papel);color:var(--tinta-media);
  border-radius:20px;padding:3px 10px;font-size:11px;font-weight:500;
}
.chip.activo{border-color:var(--brand);color:var(--brand)}
.chip.activo:hover{background:var(--brand-suave)}
.chip.hecho{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.observado{background:#fdf4e3;border-color:#e6c86a;color:#8a6400}
.chip:disabled{opacity:.45;cursor:not-allowed}

.alerta{
  background:#fdf1ef;border:1px solid #f0c4bd;color:#8c2f22;
  border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:14px;
}
.alerta b{font-weight:600}
.vacio{padding:44px 20px;text-align:center;color:var(--tinta-media);font-size:13px}
.vacio b{display:block;color:var(--tinta);font-size:14px;margin-bottom:4px;font-weight:600}

.pendiente{color:var(--falla);font-size:11px;font-weight:500}
.curso-cab td{background:var(--brand-suave);padding:10px 12px}
.curso-cab b{font-size:13.5px;color:var(--brand-oscuro)}
.carga{padding-left:20px}
.tipo{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;
  border:1px solid var(--linea);border-radius:5px;padding:1px 7px;color:var(--tinta-media);background:var(--papel)}

/* -------------------------------------------------------------------- ficha */
.migas{font-size:12px;color:var(--tinta-media);margin-bottom:12px}
.migas button{
  background:none;border:none;color:var(--brand);padding:0;font-size:12px;
  text-decoration:underline;text-underline-offset:2px;
}
.ficha{background:var(--papel);border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.ficha-cab{padding:16px 18px;border-bottom:1px solid var(--linea);background:var(--fondo)}
.ficha-cab{position:relative}
.ficha-cab h2{font-size:17px;padding-right:170px}
.volver-panel{position:absolute;top:14px;right:16px}
@media (max-width:760px){.ficha-cab h2{padding-right:0}.volver-panel{position:static;margin-bottom:10px}}
.ficha-cab .meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--tinta-media)}
.ficha-cab .meta span b{color:var(--tinta);font-weight:600}
.llave{
  display:inline-block;margin-top:10px;padding:3px 8px;border-radius:5px;
  background:var(--brand-suave);color:var(--brand-oscuro);font-size:11px;
}
.ficha-cuerpo{padding:18px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
label{display:block;font-size:11px;font-weight:600;color:var(--tinta-media);margin-bottom:4px}
label .req{color:var(--falla)}
.rejilla select,.rejilla input{width:100%}

.items{border:1px solid var(--linea);border-radius:8px;overflow:hidden;margin-bottom:20px}
.item{display:grid;grid-template-columns:34px 1fr 132px;gap:12px;padding:10px 12px;align-items:center;border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:none}
.item:nth-child(odd){background:#fbfcfc}
.item .n{font-size:11px;color:var(--tinta-tenue);font-weight:500}
.item .txt{font-size:13px}
.item .obs{grid-column:2 / -1;margin-top:6px}
.item .obs input{width:100%;font-size:12px}
.item select{width:100%}
.item[data-estado="Cumple"]{box-shadow:inset 3px 0 0 var(--ok)}
.item[data-estado="Parcial"]{box-shadow:inset 3px 0 0 var(--parcial)}
.item[data-estado="No cumple"]{box-shadow:inset 3px 0 0 var(--falla)}
.item[data-estado="No aplica"]{box-shadow:inset 3px 0 0 var(--neutro)}

.resumen{
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background:var(--fondo);border:1px solid var(--linea);border-radius:8px;
  padding:12px 16px;margin-bottom:20px;
}
.resumen .cifra{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1}
.resumen .cifra small{font-size:12px;font-weight:500;color:var(--tinta-media);margin-left:2px}
.resumen .det{font-size:12px;color:var(--tinta-media)}
.resumen .espacio{flex:1}

.pie{display:flex;gap:10px;align-items:center;padding-top:4px}
.aviso{font-size:12px}
.aviso.ok{color:var(--brand)}
.aviso.error{color:var(--falla)}

@media (max-width:760px){
  html{zoom:1}
  .item{grid-template-columns:28px 1fr}
  .item select{grid-column:2}
}
</style>
</head>
<body>

<header>
  <div class="sello">PCA</div>
  <div class="marca">
    <b>Portal del Coordinador de Área</b>
    <span>Facultad de Ingeniería</span>
  </div>
  <div class="espacio"></div>
  <div class="usuario oculto" id="usuarioCaja">
    <b id="usuarioNombre"></b>
    <span id="usuarioArea"></span>
  </div>
  <button class="btn gris oculto" id="btnSalir">Salir</button>
</header>

<main>

  <!-- ============================================================ ingreso -->
  <section id="ingreso">
    <div class="acceso">
      <div class="portada">
        <img src="portada.jpg" alt="Portal del Coordinador de Área — Facultad de Ingeniería, SGOE ISO 21001">
      </div>
      <div class="caja">
        <h1>Ingresa con tu cuenta URP</h1>
        <p>El portal reconoce tu área y te muestra los cursos que te toca supervisar este ciclo.</p>
        <div id="botonGoogle"></div>
        <div class="aviso error" id="ingresoError"></div>
        <div class="nota">Solo cuentas del dominio urp.edu.pe registradas como coordinador de área.</div>
      </div>
    </div>
  </section>

  <!-- ============================================================ tablero -->
  <section id="tablero" class="oculto">
    <div class="barra">
      <div>
        <h2>Mis cursos</h2>
        <div class="sub" id="tableroSub"></div>
      </div>
      <div class="espacio"></div>
      <div class="filtro">
        <label for="filtroCiclo" style="margin:0">Ciclo</label>
        <select id="filtroCiclo"></select>
      </div>
    </div>
    <div id="tableroAlertas"></div>
    <div class="tabla" id="tableroTabla"></div>
  </section>

  <!-- ============================================== ficha (módulo activo) -->
  <section id="ficha" class="oculto">
    <div class="migas"><button id="volver">Mis cursos</button> / <span id="fichaModulo"></span></div>
    <div class="ficha">
      <div class="ficha-cab">
        <button class="btn fantasma volver-panel" id="volverArriba">‹ Volver a mis cursos</button>
        <h2 id="fichaCurso"></h2>
        <div class="meta" id="fichaMeta"></div>
        <div class="llave mono" id="fichaLlave"></div>
      </div>
      <div class="ficha-cuerpo">
        <div id="fichaForm"></div>
        <div class="pie">
          <button class="btn" id="btnGuardar">Guardar</button>
          <button class="btn gris" id="btnCancelar">Cancelar</button>
          <span class="aviso" id="fichaAviso"></span>
        </div>
      </div>
    </div>
  </section>

</main>

<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  'use strict';
  const CFG = window.PCA_CONFIG;
  const $ = (id) => document.getElementById(id);

  const estado = {
    credential: null,
    correo: '', nombre: '', areas: [],
    asignaciones: [],
    admin: false,
    actual: null,      // asignación abierta
    modulo: null,      // clave del módulo abierto
    registro: null     // registro existente en QuintaDB, si lo hay
  };

  /* ------------------------------------------------------------- utilidades */

  function api(ruta, opciones = {}) {
    const cfg = Object.assign({ headers: {} }, opciones);
    cfg.headers['Authorization'] = 'Bearer ' + estado.credential;
    if (cfg.body) cfg.headers['Content-Type'] = 'application/json';
    return fetch(CFG.PROXY + ruta, cfg).then(async r => {
      const data = await r.json().catch(() => ({ error: 'El proxy devolvió una respuesta ilegible' }));
      if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
      return data;
    });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function hoy() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function mostrar(seccion) {
    ['ingreso','tablero','ficha'].forEach(s => $(s).classList.toggle('oculto', s !== seccion));
    window.scrollTo(0, 0);
  }

  // QuintaDB devuelve los valores por nombre de columna, y a veces el propio
  // nombre en lugar del valor. Además los nombres pueden diferir en tildes, así
  // que la búsqueda ignora acentos y mayúsculas.
  function sinTildes(s) {
    return String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  }

  function leer(valores, nombre) {
    if (!valores) return '';
    const buscado = sinTildes(nombre);
    const clave = Object.keys(valores).find(k => sinTildes(k) === buscado);
    if (!clave) return '';
    const t = String(valores[clave] == null ? '' : valores[clave]).trim();
    if (!t || sinTildes(t) === sinTildes(clave) || /^[a-zA-Z0-9_-]{22}$/.test(t)) return '';
    return t;
  }

  function leerPrefijo(valores, prefijo) {
    const clave = Object.keys(valores || {}).find(k => k.indexOf(prefijo) === 0);
    return clave ? leer(valores, clave) : '';
  }

  /* ---------------------------------------------------------------- ingreso */

  window.onGoogleReady = function() {
    if (!window.google || !google.accounts) return;
    google.accounts.id.initialize({
      client_id: CFG.GOOGLE_CLIENT_ID,
      hd: CFG.DOMINIO,
      callback: alIngresar
    });
    google.accounts.id.renderButton($('botonGoogle'), {
      theme: 'outline', size: 'large', text: 'signin_with', locale: 'es', width: 280
    });
  };

  function alIngresar(respuesta) {
    estado.credential = respuesta.credential;
    $('ingresoError').textContent = '';
    api('/sesion')
      .then(datos => {
        estado.correo = datos.correo;
        estado.nombre = datos.nombre;
        estado.areas = datos.areas;
        estado.admin = !!datos.admin;
        $('usuarioNombre').textContent = datos.nombre;
        $('usuarioArea').textContent = estado.admin
          ? 'Administrador' + (datos.areas.length ? ' · ' + datos.areas.join(' · ') : '')
          : datos.areas.join(' · ');
        $('usuarioCaja').classList.remove('oculto');
        $('btnSalir').classList.remove('oculto');
        prepararCiclos();
        cargarAsignaciones();
      })
      .catch(e => { $('ingresoError').textContent = e.message; });
  }

  $('btnSalir').addEventListener('click', () => {
    if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
    estado.credential = null;
    $('usuarioCaja').classList.add('oculto');
    $('btnSalir').classList.add('oculto');
    mostrar('ingreso');
  });

  // Secuencia en que el coordinador hace el trabajo, no el orden del config.
  const ORDEN_MODULOS = ['silabo','formularios','aulaVirtual','portafolios','delegados','entrevistas'];

  /* ---------------------------------------------------------------- tablero */

  function prepararCiclos() {
    const sel = $('filtroCiclo');
    sel.innerHTML = '';
    [CFG.CICLO_ACTIVO, ''].forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c || 'Todos los ciclos';
      sel.appendChild(o);
    });
    sel.onchange = cargarAsignaciones;
  }

  function cargarAsignaciones() {
    $('tableroTabla').innerHTML = '<div class="vacio">Cargando tus cursos…</div>';
    mostrar('tablero');
    api('/asignaciones?ciclo=' + encodeURIComponent($('filtroCiclo').value))
      .then(datos => { estado.asignaciones = datos.asignaciones; pintarTablero(); })
      .catch(e => {
        $('tableroTabla').innerHTML = '<div class="vacio"><b>No se pudieron cargar los cursos</b>' + esc(e.message) + '</div>';
      });
  }

  function pintarTablero() {
    const lista = estado.asignaciones;
    const ambito = estado.admin ? 'Toda la Facultad' : estado.areas.join(' · ');
    $('tableroSub').textContent = ambito +
      ' — ' + lista.length + (lista.length === 1 ? ' asignación' : ' asignaciones');

    const incompletas = lista.filter(a => a.faltantes.length);
    $('tableroAlertas').innerHTML = incompletas.length
      ? '<div class="alerta"><b>' + incompletas.length + ' asignación(es) sin datos completos.</b> ' +
        'No se les puede generar el ID ni registrar supervisiones hasta que se complete lo que falta en Docentes DAI.</div>'
      : '';

    if (!lista.length) {
      $('tableroTabla').innerHTML = '<div class="vacio"><b>Todavía no hay cursos en tu área</b>' +
        'Cuando se cargue la carga lectiva del ciclo, aparecerán aquí.</div>';
      return;
    }

    // Un curso puede tener varias cargas: teoría y uno o más laboratorios, con
    // docentes distintos. Se agrupa por curso y cada carga es una fila.
    const cursos = [];
    lista.forEach((a, i) => {
      const clave = (a.codigo || '') + '¦' + a.asignatura;
      let g = cursos.find(x => x.clave === clave);
      if (!g) { g = { clave, a, cargas: [] }; cursos.push(g); }
      g.cargas.push({ a, i });
    });

    const orden = { 'Teo':0, 'Tal':1, 'Prá':2, 'Pra':2, 'Lab':3 };

    // Teoría y laboratorio del mismo grupo y el mismo docente son una sola
    // supervisión: mismo curso, mismo sílabo, mismos alumnos. Solo se separan
    // cuando el laboratorio está a cargo de otro docente.
    cursos.forEach(g => {
      const fusion = [];
      g.cargas.forEach(c => {
        const clave = (c.a.docente || '') + '¦' + (c.a.grupo || '');
        const ya = fusion.find(f => f.clave === clave);
        if (ya) ya.partes.push(c); else fusion.push({ clave, partes: [c] });
      });
      g.filas = fusion.map(f => {
        f.partes.sort((x, y) => (orden[x.a.tipo] ?? 9) - (orden[y.a.tipo] ?? 9));
        return { ancla: f.partes[0], partes: f.partes };
      });
      g.filas.sort((x, y) =>
        (orden[x.ancla.a.tipo] ?? 9) - (orden[y.ancla.a.tipo] ?? 9) ||
        String(x.ancla.a.grupo).localeCompare(String(y.ancla.a.grupo), 'es', { numeric: true }));
    });

    const filas = cursos.map(g => {
      const c = g.a;
      const cabecera = '<tr class="curso-cab"><td colspan="3">' +
        '<b>' + esc(c.asignatura) + '</b>' +
        '<small class="codigo">' + esc(c.codigo || 'sin código') +
          ' · sem. ' + esc(c.semestre || '—') + ' · plan ' + esc(c.planEstudio || '—') +
          ' · ' + esc(c.programa || '—') + ' · ' + esc(c.area || '—') +
          ' · ' + g.filas.length + (g.filas.length === 1 ? ' carga' : ' cargas') +
        '</small></td></tr>';

      const cargas = g.filas.map(({ ancla, partes }) => {
        const a = ancla.a, i = ancla.i;
        const bloqueada = a.faltantes.length > 0;
        const chips = ORDEN_MODULOS.map(clave => [clave, CFG.MODULOS[clave]]).map(([clave, m]) =>
          '<button class="chip' + (bloqueada ? '' : ' activo') + '" ' +
          (bloqueada ? 'disabled' : 'data-abrir="' + clave + '" data-fila="' + i + '"') +
          '>' + esc(m.corto) + '</button>').join('');

        const tipos = [...new Set(partes.map(p => p.a.tipo || '?'))].join(' + ');
        const subs = [...new Set(partes.map(p => p.a.subGrupo).filter(x => x !== ''))];
        const etiqueta = 'grupo ' + (a.grupo || '—') +
          (subs.length ? ' · subgrupo' + (subs.length > 1 ? 's ' : ' ') + subs.join(', ') : '');

        return '<tr>' +
          '<td class="carga"><span class="tipo">' + esc(tipos) + '</span>' +
            '<small class="codigo">' + esc(etiqueta) + '</small>' +
            (bloqueada ? '<div class="pendiente">Falta ' + esc(a.faltantes.join(', ')) + '</div>' : '') +
          '</td>' +
          '<td>' + esc(a.docente) + '</td>' +
          '<td><div class="chips">' + chips + '</div></td>' +
        '</tr>';
      }).join('');

      return cabecera + cargas;
    }).join('');

    $('tableroTabla').innerHTML =
      '<table><thead><tr><th>Carga</th><th>Docente</th><th>Módulos</th></tr></thead>' +
      '<tbody>' + filas + '</tbody></table>';

    $('tableroTabla').querySelectorAll('[data-abrir]').forEach(b => {
      b.addEventListener('click', () => {
        abrirModulo(estado.asignaciones[Number(b.dataset.fila)], b.dataset.abrir);
      });
    });
  }

  /* ================================================ descripción de módulos ==
     Cada módulo se declara con bloques. El motor de abajo pinta el formulario,
     lo rellena al releer y arma los valores al guardar. Agregar un módulo nuevo
     es agregar una entrada aquí, sin tocar el motor.
     ------------------------------------------------------------------------ */

  const ESCALA = CFG.ESCALA;

  const FORMULARIOS = {

    silabo: {
      guardar: 'Guardar revisión',
      bloques: [
        { tipo:'grid', campos:[
          { k:'revisor', etq:'Revisor', tipo:'texto', req:true, auto:'nombre' },
          { k:'fechaRevision', etq:'Fecha de revisión', tipo:'fecha', req:true, auto:'hoy' }
        ]},
        { tipo:'escala', fuente:'items', obs:true, opciones:ESCALA,
          cuenta:'Cumple', excluye:'No aplica',
          campoCuenta:'itemsConformes', campoPct:'porcentaje', rotulo:'cumplimiento' },
        { tipo:'grid', campos:[
          { k:'estado', etq:'Estado del sílabo', tipo:'select', opciones:CFG.ESTADOS_SILABO },
          { k:'fechaLevantamiento', etq:'Fecha de levantamiento', tipo:'fecha' }
        ]},
        { tipo:'grid', ancho:true, campos:[
          { k:'observaciones', etq:'Observaciones generales', tipo:'textarea',
            ayuda:'Lo que se comunicó al docente y con qué plazo.' },
          { k:'enlace', etq:'Enlace de evidencia', tipo:'url' }
        ]}
      ]
    },

    entrevistas: {
      guardar: 'Guardar entrevista',
      bloques: [
        { tipo:'grid', campos:[
          { k:'fechaHora', etq:'Fecha y hora de reunión', tipo:'fechahora', req:true },
          { k:'modalidad', etq:'Modalidad', tipo:'select', opciones:['Presencial','Virtual','Mixta'], req:true },
          { k:'delegado', etq:'Delegado', tipo:'texto', req:true },
          { k:'subdelegado', etq:'Subdelegado', tipo:'texto' }
        ]},
        { tipo:'textos', fuente:'temas', titulo:'Temas tratados' },
        { tipo:'grid', ancho:true, campos:[
          { k:'compromisos', etq:'Compromisos acordados', tipo:'textarea',
            ayuda:'Qué se acordó y con qué plazo.' },
          { k:'alerta', etq:'¿Requiere atención de la Escuela?', col:'Alerta', tipo:'select', opciones:['Si','No'], req:true },
          { k:'enlace', etq:'Enlace de evidencia', tipo:'url' }
        ]}
      ]
    },

    formularios: {
      guardar: 'Guardar cumplimiento',
      bloques: [
        { tipo:'grid', campos:[
          { k:'fechaRevision', etq:'Fecha de revisión', tipo:'fecha', req:true, auto:'hoy' }
        ]},
        { tipo:'grid', titulo:'Formularios', campos:[
          { k:'f1', etq:'F1', tipo:'select', opciones:['Presentado','Pendiente','Fuera de plazo','No aplica'], req:true },
          { k:'fechaF1', etq:'Fecha F1', tipo:'fecha' },
          { k:'f2', etq:'F2', tipo:'select', opciones:['Presentado','Pendiente','Fuera de plazo','No aplica'], req:true },
          { k:'fechaF2', etq:'Fecha F2', tipo:'fecha' },
          { k:'f3', etq:'F3', tipo:'select', opciones:['Presentado','Pendiente','Fuera de plazo','No aplica'], req:true },
          { k:'fechaF3', etq:'Fecha F3', tipo:'fecha' }
        ], contar:{ desde:['f1','f2','f3'], valor:'Presentado', campo:'presentados', rotulo:'formularios presentados' } },
        { tipo:'grid', ancho:true, campos:[
          { k:'observaciones', etq:'Observaciones', tipo:'textarea' }
        ]}
      ]
    },

    aulaVirtual: {
      guardar: 'Guardar supervisión',
      bloques: [
        { tipo:'grid', campos:[
          { k:'fechaSupervision', etq:'Fecha de supervisión', tipo:'fecha', req:true, auto:'hoy' },
          { k:'responsable', etq:'Responsable de la supervisión', tipo:'texto', req:true, auto:'nombre' }
        ]},
        { tipo:'escala', fuente:'criterios', obs:false, opciones:ESCALA,
          cuenta:'Cumple', excluye:'No aplica',
          campoCuenta:'cumplidos', campoPct:'porcentaje', rotulo:'cumplimiento' },
        { tipo:'grid', ancho:true, campos:[
          { k:'observaciones', etq:'Observaciones', tipo:'textarea' },
          { k:'enlace', etq:'Enlace de evidencia', tipo:'url' }
        ]}
      ]
    },

    portafolios: {
      guardar: 'Guardar supervisión',
      bloques: [
        { tipo:'grid', campos:[
          { k:'fechaSupervision', etq:'Fecha de supervisión', tipo:'fecha', req:true, auto:'hoy' },
          { k:'responsable', etq:'Responsable de la supervisión', tipo:'texto', req:true, auto:'nombre' }
        ]},
        { tipo:'escala', fuente:'criterios', obs:false, opciones:ESCALA,
          cuenta:'Cumple', excluye:'No aplica',
          campoCuenta:'cumplidas', campoPct:'porcentaje', rotulo:'cumplimiento' },
        { tipo:'grid', ancho:true, campos:[
          { k:'observaciones', etq:'Observaciones', tipo:'textarea' },
          { k:'enlace', etq:'Enlace de evidencia', tipo:'url' }
        ]}
      ]
    },

    delegados: {
      guardar: 'Guardar delegados',
      bloques: [
        { tipo:'grid', titulo:'Delegado', campos:[
          { k:'codigoDelegado', etq:'Código', col:'Codigo del delegado', tipo:'texto', req:true },
          { k:'delegado', etq:'Apellidos y nombres', col:'Delegado (apellidos y nombres)', tipo:'texto', req:true },
          { k:'correoDelegado', etq:'Correo', col:'Correo del delegado', tipo:'correo', req:true },
          { k:'celularDelegado', etq:'Celular', col:'Celular del delegado', tipo:'texto' },
          { k:'fijoDelegado', etq:'Teléfono fijo', col:'Telefono fijo del delegado', tipo:'texto' }
        ]},
        { tipo:'grid', titulo:'Subdelegado', campos:[
          { k:'codigoSubdelegado', etq:'Código', col:'Codigo del subdelegado', tipo:'texto' },
          { k:'subdelegado', etq:'Apellidos y nombres', col:'Subdelegado (apellidos y nombres)', tipo:'texto' },
          { k:'correoSubdelegado', etq:'Correo', col:'Correo del subdelegado', tipo:'correo' },
          { k:'celularSubdelegado', etq:'Celular', col:'Celular del subdelegado', tipo:'texto' },
          { k:'fijoSubdelegado', etq:'Teléfono fijo', col:'Telefono fijo del subdelegado', tipo:'texto' }
        ]},
        { tipo:'grid', ancho:true, campos:[
          { k:'estado', etq:'Estado', tipo:'select', opciones:['Vigente','Reemplazado'], req:true },
          { k:'observaciones', etq:'Observaciones', tipo:'textarea' }
        ]}
      ]
    }
  };

  /* ==================================================== motor de la ficha == */

  function abrirModulo(a, clave) {
    const M = CFG.MODULOS[clave];
    const F = FORMULARIOS[clave];
    if (!M || !F) return;

    estado.actual = a;
    estado.modulo = clave;
    estado.registro = null;

    mostrar('ficha');
    $('fichaModulo').textContent = M.nombre;
    $('btnGuardar').textContent = F.guardar;
    $('btnGuardar').disabled = false;
    $('fichaCurso').textContent = a.asignatura;

    const dato = (etq, v) => v ? '<span>' + etq + ' <b>' + esc(v) + '</b></span>' : '';
    $('fichaMeta').innerHTML =
      dato('Docente', a.docente) +
      dato('Correo', a.correoDocente) +
      dato('Carrera', a.programa) +
      dato('Área', a.area) +
      dato('Código', a.codigo) +
      dato('Grupo', a.grupo) +
      dato('Subgrupo', a.subGrupo) +
      dato('Tipo', a.tipo) +
      dato('Semestre', a.semestre) +
      dato('Plan de estudio', a.planEstudio) +
      dato('Ciclo', a.ciclo);
    $('fichaLlave').textContent = a.idAsignacion || 'sin ID';
    aviso('', '');

    pintarFormulario(M, F);
    cargarRegistro(a, clave);
  }

  function campoHTML(c, idx) {
    const id = 'f_' + c.k;
    const req = c.req ? ' <span class="req">*</span>' : '';
    let control;
    if (c.tipo === 'select') {
      control = '<select id="' + id + '"><option value="">Seleccione</option>' +
        c.opciones.map(o => '<option>' + esc(o) + '</option>').join('') + '</select>';
    } else if (c.tipo === 'textarea') {
      control = '<textarea id="' + id + '"' +
        (c.ayuda ? ' placeholder="' + esc(c.ayuda) + '"' : '') + '></textarea>';
    } else {
      const tipos = { fecha:'date', fechahora:'datetime-local', url:'url', correo:'email' };
      control = '<input type="' + (tipos[c.tipo] || 'text') + '" id="' + id + '"' +
        (c.tipo === 'url' ? ' placeholder="https://drive.google.com/..."' : '') + '>';
    }
    const ancho = (c.tipo === 'textarea' || c.tipo === 'url') ? ' class="full"' : '';
    return '<div' + ancho + '><label for="' + id + '">' + esc(c.etq) + req + '</label>' + control + '</div>';
  }

  function pintarFormulario(M, F) {
    const partes = F.bloques.map((b, bi) => {
      if (b.tipo === 'grid') {
        const titulo = b.titulo ? '<div class="subtitulo">' + esc(b.titulo) + '</div>' : '';
        const cuerpo = '<div class="rejilla">' + b.campos.map(campoHTML).join('') + '</div>';
        const cont = b.contar
          ? '<div class="resumen"><div><div class="cifra" id="b' + bi + '_cifra">0</div>' +
            '<div class="det">' + esc(b.contar.rotulo) + '</div></div></div>'
          : '';
        return titulo + cuerpo + cont;
      }

      if (b.tipo === 'escala') {
        const lista = M[b.fuente] || [];
        const opciones = '<option value="">Seleccione</option>' +
          b.opciones.map(v => '<option>' + esc(v) + '</option>').join('');
        const filas = lista.map((it, i) => {
          const n = it.n || String(i + 1).padStart(2, '0');
          const obs = b.obs
            ? '<div class="obs oculto"><input type="text" data-obs="' + i + '" placeholder="Qué falta o qué corregir"></div>'
            : '';
          return '<div class="item" data-i="' + i + '">' +
            '<div class="n mono">' + esc(n) + '</div>' +
            '<div class="txt">' + esc(it.etiqueta) + '</div>' +
            '<div><select data-estado="' + i + '">' + opciones + '</select></div>' +
            obs + '</div>';
        }).join('');
        return '<div class="items" id="listaItems">' + filas + '</div>' +
          '<div class="resumen">' +
            '<div><div class="cifra" id="rPorcentaje">0<small>%</small></div>' +
            '<div class="det">' + esc(b.rotulo) + '</div></div>' +
            '<div class="det" id="rDetalle">Sin evaluar</div>' +
          '</div>';
      }

      if (b.tipo === 'textos') {
        const lista = M[b.fuente] || [];
        const titulo = b.titulo ? '<div class="subtitulo">' + esc(b.titulo) + '</div>' : '';
        return titulo + '<div class="temas">' + lista.map((t, i) =>
          '<div><label for="t_' + i + '">' + esc(t.etiqueta) + '</label>' +
          '<textarea id="t_' + i + '" data-tema="' + i + '"></textarea></div>'
        ).join('') + '</div>';
      }
      return '';
    });

    $('fichaForm').innerHTML = partes.join('');

    // Valores automáticos
    F.bloques.forEach(b => {
      (b.campos || []).forEach(c => {
        const el = $('f_' + c.k);
        if (!el) return;
        if (c.auto === 'hoy') el.value = hoy();
        if (c.auto === 'nombre') el.value = estado.nombre || '';
        if (b.contar) el.addEventListener('change', () => recalcularConteo(F));
      });
    });

    // Escala: mostrar la observación cuando el ítem no está conforme
    const cont = $('listaItems');
    if (cont) {
      cont.querySelectorAll('[data-estado]').forEach(sel => {
        sel.addEventListener('change', () => {
          const fila = sel.closest('.item');
          fila.dataset.estado = sel.value;
          const obs = fila.querySelector('.obs');
          if (obs) obs.classList.toggle('oculto', !(sel.value === 'Parcial' || sel.value === 'No cumple'));
          recalcularEscala(F);
        });
      });
    }
    recalcularEscala(F);
    recalcularConteo(F);
  }

  function bloqueEscala(F) { return F.bloques.find(b => b.tipo === 'escala'); }

  function recalcularEscala(F) {
    const b = bloqueEscala(F);
    if (!b || !$('listaItems')) return null;
    const valores = [...$('listaItems').querySelectorAll('[data-estado]')].map(s => s.value);
    const aplicables = valores.filter(v => v && v !== b.excluye).length;
    const conformes = valores.filter(v => v === b.cuenta).length;
    const evaluados = valores.filter(v => v).length;
    const pct = aplicables ? Math.round((conformes / aplicables) * 1000) / 10 : 0;

    $('rPorcentaje').innerHTML = pct + '<small>%</small>';
    $('rDetalle').textContent = evaluados
      ? conformes + ' de ' + aplicables + ' aplicables conformes · ' + evaluados + '/' + valores.length + ' evaluados'
      : 'Sin evaluar';
    return { conformes, aplicables, pct, evaluados, total: valores.length };
  }

  function recalcularConteo(F) {
    F.bloques.forEach((b, bi) => {
      if (!b.contar) return;
      const n = b.contar.desde.filter(k => {
        const el = $('f_' + k);
        return el && el.value === b.contar.valor;
      }).length;
      const c = $('b' + bi + '_cifra');
      if (c) c.textContent = n;
    });
  }

  /* ------------------------------------------------------ leer lo guardado */

  function cargarRegistro(a, clave) {
    api('/modulo?clave=' + encodeURIComponent(clave) + '&idAsignacion=' + encodeURIComponent(a.idAsignacion))
      .then(datos => {
        if (!datos.registro) return;
        estado.registro = datos.registro;
        const v = datos.registro.valores;
        const M = CFG.MODULOS[clave];
        const F = FORMULARIOS[clave];

        F.bloques.forEach(b => {
          (b.campos || []).forEach(c => {
            const el = $('f_' + c.k);
            if (!el) return;
            let val = leer(v, c.col || c.etq);
            if (!val && c.k === 'fechaRevision') val = leer(v, 'Fecha de revision');
            if (c.tipo === 'fecha') val = val.slice(0, 10);
            if (c.tipo === 'fechahora') val = val.replace(' ', 'T').slice(0, 16);
            if (val) el.value = val;
          });

          if (b.tipo === 'escala') {
            (M[b.fuente] || []).forEach((it, i) => {
              const guardado = it.n ? leerPrefijo(v, it.n + ' ') : leer(v, it.etiqueta);
              const sel = $('listaItems').querySelector('[data-estado="' + i + '"]');
              if (guardado && sel) { sel.value = guardado; sel.dispatchEvent(new Event('change')); }
              if (b.obs && it.n) {
                const obs = leer(v, 'Obs ' + it.n);
                const campo = $('listaItems').querySelector('[data-obs="' + i + '"]');
                if (obs && campo) { campo.value = obs; campo.closest('.obs').classList.remove('oculto'); }
              }
            });
          }

          if (b.tipo === 'textos') {
            (M[b.fuente] || []).forEach((t, i) => {
              const campo = document.querySelector('[data-tema="' + i + '"]');
              const val = leer(v, t.etiqueta);
              if (campo && val) campo.value = val;
            });
          }
        });

        recalcularEscala(F);
        recalcularConteo(F);
        aviso('Registro existente cargado. Al guardar se actualiza.', 'ok');
      })
      .catch(e => aviso(e.message, 'error'));
  }

  function aviso(texto, tipo) {
    const el = $('fichaAviso');
    el.textContent = texto;
    el.className = 'aviso ' + (tipo || '');
  }

  $('volver').addEventListener('click', () => mostrar('tablero'));
  $('volverArriba').addEventListener('click', () => mostrar('tablero'));
  $('btnCancelar').addEventListener('click', () => mostrar('tablero'));

  /* --------------------------------------------------------------- guardar */

  $('btnGuardar').addEventListener('click', () => {
    const a = estado.actual;
    const clave = estado.modulo;
    const M = CFG.MODULOS[clave];
    const F = FORMULARIOS[clave];
    const valores = {};

    // Bloque común: los mismos nueve campos en las seis tablas
    valores[M.comun.ciclo]       = a.ciclo;
    valores[M.comun.programa]    = a.programa;
    valores[M.comun.area]        = a.area;
    valores[M.comun.codigo]      = a.codigo;
    valores[M.comun.asignatura]  = a.asignatura;
    valores[M.comun.docente]     = a.docente;
    valores[M.comun.grupo]       = a.grupo;
    valores[M.comun.coordinador] = estado.nombre;
    valores[M.comun.subGrupo]    = a.subGrupo || '';
    valores[M.comun.tipo]        = a.tipo || '';

    // Campos propios del módulo
    for (const b of F.bloques) {
      for (const c of (b.campos || [])) {
        const el = $('f_' + c.k);
        if (!el) continue;
        const val = String(el.value || '').trim();
        if (c.req && !val) { return aviso('Falta completar: ' + c.etq + '.', 'error'); }
        if (M.campos[c.k]) valores[M.campos[c.k]] = val;
      }
      if (b.contar) {
        const n = b.contar.desde.filter(k => $('f_' + k) && $('f_' + k).value === b.contar.valor).length;
        if (M.campos[b.contar.campo]) valores[M.campos[b.contar.campo]] = n;
      }
    }

    // Escala de criterios o ítems
    const be = bloqueEscala(F);
    if (be) {
      const lista = M[be.fuente] || [];
      const selects = [...$('listaItems').querySelectorAll('[data-estado]')];
      const sinEvaluar = selects.findIndex(s => !s.value);
      if (sinEvaluar >= 0) {
        const it = lista[sinEvaluar];
        return aviso('Falta evaluar: ' + (it.n ? 'ítem ' + it.n : it.etiqueta) + '.', 'error');
      }
      if (be.obs) {
        const falta = lista.findIndex((it, i) => {
          const v = selects[i].value;
          const campo = $('listaItems').querySelector('[data-obs="' + i + '"]');
          return (v === 'Parcial' || v === 'No cumple') && campo && !campo.value.trim();
        });
        if (falta >= 0) {
          return aviso('El ítem ' + lista[falta].n + ' está observado y necesita una observación.', 'error');
        }
      }
      const r = recalcularEscala(F);
      lista.forEach((it, i) => {
        valores[it.estado || it.id] = selects[i].value;
        if (be.obs && it.obs) {
          const campo = $('listaItems').querySelector('[data-obs="' + i + '"]');
          valores[it.obs] = campo ? campo.value.trim() : '';
        }
      });
      if (M.campos[be.campoCuenta]) valores[M.campos[be.campoCuenta]] = r.conformes;
      if (M.campos[be.campoPct]) valores[M.campos[be.campoPct]] = r.pct;
    }

    // Temas de texto libre
    const bt = F.bloques.find(b => b.tipo === 'textos');
    if (bt) {
      (M[bt.fuente] || []).forEach((t, i) => {
        const campo = document.querySelector('[data-tema="' + i + '"]');
        valores[t.id] = campo ? campo.value.trim() : '';
      });
    }

    $('btnGuardar').disabled = true;
    aviso('Guardando…', '');
    api('/modulo', {
      method: 'POST',
      body: JSON.stringify({
        clave,
        idAsignacion: a.idAsignacion,
        recordId: estado.registro ? estado.registro.recordId : null,
        valores
      })
    })
      .then(r => {
        if (r.recordId && !estado.registro) estado.registro = { recordId: r.recordId, valores: {} };
        aviso('Guardado.', 'ok');
        $('btnGuardar').disabled = false;
      })
      .catch(e => { aviso(e.message, 'error'); $('btnGuardar').disabled = false; });
  });

  /* --------------------------------------------------------------- arranque */

  let intentos = 0;
  (function esperarGoogle() {
    if (window.google && window.google.accounts) return window.onGoogleReady();
    if (++intentos > 40) {
      $('ingresoError').textContent = 'No se pudo cargar el acceso de Google. Revisa tu conexión y recarga la página.';
      return;
    }
    setTimeout(esperarGoogle, 150);
  })();

})();
</script>
