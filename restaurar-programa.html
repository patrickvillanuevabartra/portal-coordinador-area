<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mantenimiento del catálogo — PCA</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0f8f5e;--tinta:#15201b;--tinta-media:#5a6660;--linea:#dfe4e1;--fondo:#f6f8f7;--papel:#fff;--falla:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:32px 20px}
h1{font-size:20px;margin:0 0 6px}
p.sub{color:var(--tinta-media);margin:0 0 24px;font-size:13px}
.caja{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:24px;margin-bottom:16px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:9px 18px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.resumen{display:flex;gap:26px;margin-bottom:18px;flex-wrap:wrap}
.resumen div span{display:block;font-size:11px;color:var(--tinta-media);text-transform:uppercase;letter-spacing:.05em}
.resumen div b{font-size:22px;font-weight:700}
#log{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#0f1613;color:#c8e6d8;border-radius:8px;padding:14px;max-height:320px;overflow:auto;white-space:pre-wrap;display:none;margin-top:16px}
.aviso{font-size:13px;margin-top:12px}
.aviso.error{color:var(--falla)}
.aviso.ok{color:var(--brand)}
.nota{font-size:12px;color:var(--tinta-media);border-left:3px solid var(--linea);padding-left:12px;margin-top:18px}
</style></head><body>
<main>
  <h1>Restaurar el campo Programa</h1>
  <p class="sub">Devuelve el programa a los 147 cursos que lo perdieron. Prueba primero con uno.</p>

  <div class="caja">
    <div class="resumen">
      <div><span>Registros</span><b id="nTotal">0</b></div>
      <div><span>Industrial</span><b id="nInd">0</b></div>
      <div><span>Mecatrónica</span><b id="nMec">0</b></div>
    </div>
    <div id="botonGoogle"></div>
    <div id="zonaAccion" style="display:none">
      <button class="btn" id="btnProbar">1. Probar con un registro</button>
      <button class="btn" id="btnAplicar" disabled style="margin-left:8px">2. Aplicar a los 147</button>
      <span class="aviso" id="aviso"></span>
    </div>
    <div class="aviso error" id="error"></div>
    <div id="log"></div>
    <div class="nota">El área no se toca aquí: es un campo de relación y no se puede escribir por REST. Se asigna desde QuintaDB.</div>
  </div>
</main>

  window.onGoogleReady = function(){
    google.accounts.id.initialize({ client_id: CFG.GOOGLE_CLIENT_ID, hd: CFG.DOMINIO, callback: alIngresar });
    google.accounts.id.renderButton($('botonGoogle'), { theme:'outline', size:'large', text:'signin_with', locale:'es', width:280 });
  };

  function alIngresar(r){
    credential = r.credential;
    fetch(CFG.PROXY + '/sesion', { headers:{ Authorization:'Bearer '+credential } })
      .then(x => x.json())
      .then(d => {
        if (d.error) throw new Error(d.error);
        $('botonGoogle').style.display='none';
        $('zonaAccion').style.display='block';
        $('aviso').textContent = 'Sesión iniciada como ' + d.correo;
        $('aviso').className = 'aviso ok';
      })
      .catch(e => { $('error').textContent = e.message; });
  }

  async function llamar(cuerpo){
    const r = await fetch(CFG.PROXY + '/lote-programa', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+credential, 'Content-Type':'application/json' },
      body: JSON.stringify(cuerpo)
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    return d;
  }

  $('btnProbar').addEventListener('click', async () => {
    $('btnProbar').disabled = true; $('error').textContent = '';
    escribir('Probando con: ' + CAMBIOS[0].curso);
    try {
      const d = await llamar({ cambios: CAMBIOS, probar: true });
      escribir('Programas que existen en la tabla: ' + (d.programasDisponibles||[]).join(', '));
      escribir('Valor que quedo en el registro: "' + d.quedoGuardado + '"');
      if ((d.fallidos||[]).length) d.fallidos.forEach(f => escribir('  problema: ' + f.motivo));
      if (d.quedoGuardado && d.quedoGuardado !== '(no se pudo releer)') {
        escribir('');
        escribir('FUNCIONA. Ya puedes aplicar a los 147.');
        $('btnAplicar').disabled = false;
      } else {
        escribir('');
        escribir('NO quedo guardado. La relacion no se puede escribir por REST.');
      }
    } catch(e) { escribir('ERROR: ' + e.message); }
    $('btnProbar').disabled = false;
  });

  $('btnAplicar').addEventListener('click', async () => {
    $('btnAplicar').disabled = true;
    escribir('Aplicando ' + CAMBIOS.length + ' en tandas de 25...');
    let ok = 0; const fallos = [];
    for (let i = 0; i < CAMBIOS.length; i += 25) {
      try {
        const d = await llamar({ cambios: CAMBIOS.slice(i, i+25) });
        ok += d.actualizados;
        (d.fallidos||[]).forEach(f => fallos.push(f));
        escribir('  tanda ' + (i/25+1) + ': ' + d.actualizados + ' listos');
      } catch(e){ escribir('  tanda ' + (i/25+1) + ' fallo: ' + e.message); }
    }
    escribir(''); escribir('Terminado. ' + ok + ' registros restaurados.');
    fallos.forEach(f => escribir('  - ' + f.curso + ': ' + f.motivo));
    $('btnAplicar').disabled = false;
  });

  let n = 0;
  (function esperar(){
    if (window.google && window.google.accounts) return window.onGoogleReady();
    if (++n > 40) { $('error').textContent = 'No se pudo cargar el acceso de Google.'; return; }
    setTimeout(esperar, 150);
  })();
})();
</script>
</body></html>
