<style>

*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:32px 20px}

.btn.g{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cifra{font-size:26px;font-weight:700}
.det{font-size:11px;color:var(--tinta-media);text-transform:uppercase;letter-spacing:.05em}

.aviso{font-size:13px;margin-left:10px}
.aviso.error{color:var(--falla)}
.aviso.ok{color:var(--brand)}
</style></head><body>
<main>
  <h1>Cargar áreas en el catálogo de cursos</h1>
  <p class="sub">Escribe el área en el campo «Área texto» de Cursos-Sumillas. Prueba primero con uno.</p>

    <div style="margin-bottom:16px"><div class="cifra" id="n">0</div><div class="det">cursos con área</div></div>
    <div id="botonGoogle"></div>
    <div id="zona" style="display:none">

      <span class="aviso" id="aviso"></span>
    </div>
    <div class="aviso error" id="error"></div>
    <div id="log"></div>
  </div>
</main>
