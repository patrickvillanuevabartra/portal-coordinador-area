<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completar códigos — PCA</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#0f8f5e;--tinta:#15201b;--tinta-media:#5a6660;--linea:#dfe4e1;--fondo:#f6f8f7;--papel:#fff;--falla:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.55}
main{max-width:760px;margin:0 auto;padding:32px 20px}
h1{font-size:20px;margin:0 0 6px}
p.sub{color:var(--tinta-media);margin:0 0 24px;font-size:13px}
.caja{background:var(--papel);border:1px solid var(--linea);border-radius:12px;padding:24px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:9px 18px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.btn.g{background:transparent;color:var(--brand)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cifra{font-size:26px;font-weight:700}
.det{font-size:11px;color:var(--tinta-media);text-transform:uppercase;letter-spacing:.05em}
#log{font-family:'IBM Plex Mono',monospace;font-size:12px;background:#0f1613;color:#c8e6d8;border-radius:8px;padding:14px;max-height:340px;overflow:auto;white-space:pre-wrap;display:none;margin-top:16px}
.aviso{font-size:13px;margin-left:10px}
.aviso.error{color:var(--falla)}
.aviso.ok{color:var(--brand)}
</style></head><body>
<main>
  <h1>Completar códigos en el catálogo</h1>
  <p class="sub">Escribe el código de los cursos de Civil que no lo tienen. Prueba primero con uno.</p>
  <div class="caja">
    <div style="margin-bottom:16px"><div class="cifra" id="n">0</div><div class="det">cursos sin código</div></div>
    <div id="botonGoogle"></div>
    <div id="zona" style="display:none">
      <button class="btn g" id="btnProbar">1. Probar con un curso</button>
      <button class="btn" id="btnTodo" disabled style="margin-left:8px">2. Cargar todos</button>
      <span class="aviso" id="aviso"></span>
    </div>
    <div class="aviso error" id="error"></div>
    <div id="log"></div>
  </div>
</main>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
  'use strict';
  const CFG=window.PCA_CONFIG, $=(i)=>document.getElementById(i);
  const DATOS=[{"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Análisis Estructural I", "codigo": "IC0602"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Análisis Estructural II", "codigo": "IC0701"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Cimentaciones", "codigo": "IC0803"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Concreto Armado I", "codigo": "IC0702"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Concreto Armado II", "codigo": "IC0801"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Concreto Pretensado", "codigo": "IC0909"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Construcción II", "codigo": "IC0707"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Dibujo Asistido por Computadora", "codigo": "IC0507"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Dinámica", "codigo": "IC0403"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Diseño Geométrico de Vías", "codigo": "IC0601"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Diseño Geotécnico", "codigo": "IC0907"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Diseño en Acero", "codigo": "IC0901"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Estática", "codigo": "IC0301"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Evaluación de Proyectos de Ingeniería", "codigo": "IC0904"}, {"programa": "Ingeniería Civil", "plan": "2015-II", "curso": "Taller de Obras Hidráulicas", "codigo": "IC1003"}, {"programa": "Ingeniería Civil", "plan": "2024-I", "curso": "Construcción", "codigo": "IC0604"}, {"programa": "Ingeniería Civil", "plan": "2024-I", "curso": "Ingeniería de ríos y costas", "codigo": "IC0808"}, {"programa": "Ingeniería Civil", "plan": "2024-I", "curso": "Introducción a la Ingeniería Civil", "codigo": "IC0101"}, {"programa": "Ingeniería Civil", "plan": "2024-I", "curso": "Resistencia de materiales", "codigo": "IC0501"}, {"programa": "Ingeniería Civil", "plan": "2024-I", "curso": "Tecnología del concreto I", "codigo": "IC0503"}, {"programa": "Ingeniería Civil", "plan": "2024-I", "curso": "Topografía", "codigo": "IC0404"}]; let cred=null;
  $('n').textContent=DATOS.length;
  function log(t){const l=$('log');l.style.display='block';l.textContent+=t+'\n';l.scrollTop=l.scrollHeight;}
  window.onGoogleReady=function(){
    google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,hd:CFG.DOMINIO,callback:e=>{
      cred=e.credential;
      fetch(CFG.PROXY+'/sesion',{headers:{Authorization:'Bearer '+cred}}).then(r=>r.json()).then(d=>{
        if(d.error) throw new Error(d.error);
        $('botonGoogle').style.display='none'; $('zona').style.display='block';
        $('aviso').textContent='Sesión iniciada como '+d.correo; $('aviso').className='aviso ok';
      }).catch(e=>{$('error').textContent=e.message;});
    }});
    google.accounts.id.renderButton($('botonGoogle'),{theme:'outline',size:'large',text:'signin_with',locale:'es',width:280});
  };
  async function llamar(c){
    const r=await fetch(CFG.PROXY+'/codigo-catalogo',{method:'POST',
      headers:{'Authorization':'Bearer '+cred,'Content-Type':'application/json'},body:JSON.stringify(c)});
    const d=await r.json(); if(d.error) throw new Error(d.error); return d;
  }
  $('btnProbar').addEventListener('click',async()=>{
    $('btnProbar').disabled=true;
    log('Probando con: '+DATOS[0].curso);
    try{
      const d=await llamar({cambios:DATOS,probar:true});
      log('  Código que quedó: '+d.codigoQuedo);
      log('  Área que quedó: '+(d.areaQuedo||''));
      log('  Programa después de escribir: '+d.programaQuedo);
      (d.fallidos||[]).forEach(f=>log('  problema: '+f.motivo));
      if(d.programaQuedo.includes('PERDIÓ')){
        log(''); log('PARAR. La escritura borró el Programa. No cargar el resto.');
      } else if(d.codigoQuedo!=='(vacío)'){
        log(''); log('Todo bien: el código se guardó y el Programa sigue intacto.');
        $('btnTodo').disabled=false;
      } else { log(''); log('El código no se guardó.'); }
    }catch(e){ log('ERROR: '+e.message); }
    $('btnProbar').disabled=false;
  });
  $('btnTodo').addEventListener('click',async()=>{
    $('btnTodo').disabled=true; log('Cargando '+DATOS.length+' en tandas de 25...');
    let ok=0; const fallos=[];
    for(let i=0;i<DATOS.length;i+=25){
      try{ const d=await llamar({cambios:DATOS.slice(i,i+25)});
        ok+=d.actualizados; (d.fallidos||[]).forEach(f=>fallos.push(f));
        log('  tanda '+(i/25+1)+': '+d.actualizados+' listos');
      }catch(e){ log('  tanda '+(i/25+1)+' falló: '+e.message); }
    }
    log(''); log('Terminado. '+ok+' cursos con código.');
    fallos.forEach(f=>log('  - '+f.curso+': '+f.motivo));
    $('btnTodo').disabled=false;
  });
  let n=0;(function esperar(){ if(window.google&&window.google.accounts) return window.onGoogleReady();
    if(++n>40){$('error').textContent='No se pudo cargar el acceso de Google.';return;} setTimeout(esperar,150);})();
})();
</script></body></html>
